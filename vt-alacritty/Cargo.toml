[package]
name = "soksak-sidecar-vt-alacritty"
version = "0.0.42"
edition = "2024"
license = "MIT"
repository = "https://github.com/soksak-app/sidecar-vt"
publish = false

[[bin]]
name = "sok-vt-alacritty"
path = "src/main.rs"

[[bin]]
name = "sok-vt-replay"
path = "src/replay.rs"

[features]
# Enables the engine input recording of diagnostic builds in vt-core.
diagnostics = ["soksak-sidecar-vt-core/diagnostics"]

[dependencies]
# The fork of alacritty_terminal 0.26.0 adds `Term::inactive_grid`: the crates.io release holds the grid of the screen
# that is not shown in a private field without an accessor, so it cannot read the primary rows while the alternate
# screen is active (core docs/spec/terminal-read.md#primary-rows). Its listener calls hand over the lines that leave
# the top of the alternate screen, which keeps no history (docs/spec/vt-core.md#kept-rows-of-the-alternate-screen).
alacritty_terminal = { git = "https://github.com/min-0-max/alacritty", tag = "alacritty_terminal_v0.26.0-soksak.2" }
base64 = "0.22"
serde_json = "1"
soksak-sidecar-vt-core = { path = "../vt-core" }
compact_str = "0.9"
# The form of the time of a text record (core docs/spec/diagnostics.md#forms), which the standard library does not format.
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "time", "net", "process", "sync", "macros", "io-std"] }

[build-dependencies]
pkg-config = "0.3"
serde_json = "1"

[dev-dependencies]
libc = "0.2"
time = { version = "0.3", features = ["parsing"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
