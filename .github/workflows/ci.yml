name: ci
# build-machine: skip smoke reason=the sidecar has no application to start; its recovery test runs the built service

# release.yml calls this workflow on each push to main, so a push runs the checks once.
on:
  workflow_call:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit message check reads every commit of the pushed range.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Install
        run: make install
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Pushed range
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: make check-push RANGE=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
