name: release
# build-machine: skip test reason=the ci workflow tests the tagged commit on main before the tag is pushed
# build-machine: skip smoke reason=the sidecar has no application to start; its recovery test runs the built service

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# sok sidecar release 를 build 하는 core release. 이 저장소가 릴리스하는 version 과 관계가 없다.
env:
  CORE_RELEASE: v0.0.5

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ env.CORE_RELEASE }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/sok/wailsv3/go.mod
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package
        run: make release PROFILE=release SOK="$RUNNER_TEMP/sok" OUT=dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
