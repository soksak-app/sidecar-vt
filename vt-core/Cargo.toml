[package]
name = "soksak-sidecar-vt-core"
version = "0.0.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/soksak-app/sidecar-vt"
description = "Common VT layer: protocol, session lifetime, screen types, Engine trait."
build = "build.rs"

[lib]
path = "src/vt-core.rs"

[features]
# 진단 build 의 engine 입력 기록(engine_trace.rs).
diagnostics = []
# Test-only faults (src/pty.rs `fault`, src/events.rs `poison_policy_watch_for_test`). The tests of this feature run with
# `--features fault-injection`, which the make test target passes.
fault-injection = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["io-util", "rt", "time", "net", "process", "sync", "macros", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.21"
nix = { version = "0.27", features = ["process", "net", "fs", "signal"] }
libc = "0.2"
async-trait = "0.1"
portable-pty = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"
sha2 = "0.10"

[[test]]
name = "fault_injection"
required-features = ["fault-injection"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
