# Sidecar Rust workspace. Separated from the tauri git pin in the root Cargo.toml.
[workspace]
resolver = "2"
members = ["vt-core", "vt-alacritty"]

[profile.dev]
incremental = true

# rustc reports a linked object that was built for a newer macOS than the link under linker_info, which is allowed by
# default and so prints nothing. Each member warns on it, and scripts/check-link.mjs fails a command that prints that line;
# deny would also fail the duplicate `-lc` that every executable link reports (S163).
[workspace.lints.rust]
linker_info = "warn"
